name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate 3D apparatus models
        run: |
          python -m pip install --disable-pip-version-check trimesh==4.11.1 numpy==2.3.5
          python tools/generate_practical_glbs.py assets
      - name: Persist generated GLB models to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          NEEDS_PERSIST=false
          if git rev-parse HEAD^ >/dev/null 2>&1 && git diff --name-only HEAD^ HEAD | grep -qx 'tools/generate_practical_glbs.py'; then
            NEEDS_PERSIST=true
          fi
          for model in assets/*.glb; do
            if ! git ls-files --error-unmatch "$model" >/dev/null 2>&1; then
              NEEDS_PERSIST=true
              break
            fi
          done
          if [ "$NEEDS_PERSIST" = "true" ]; then
            git add -f assets/*.glb
            if git diff --cached --quiet; then
              echo "Generated GLBs already match main"
            else
              git commit -m "Persist generated 3D apparatus assets"
              git push origin HEAD:main
            fi
          else
            echo "GLB assets already persisted; generator unchanged"
            git restore assets/*.glb
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

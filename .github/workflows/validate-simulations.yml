name: Validate practical simulations

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          find . -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check tests/model-checks.js
          node --check tests/browser-smoke.js
          node --check tests/labbook-toggle-smoke.js
          node --check tests/learning-suite-smoke.js
          node --check tests/audit-model-sweep.js
          node --check tests/first-three-regression.cjs
          node --check tests/practicals-456-regression.cjs
          node --check tests/labbook-integrity.cjs
          node --check tests/test-worked-examples-complete.cjs
      - name: Check HTML local asset references
        run: |
          python - <<'PY'
          import os, re
          html=open('index.html',encoding='utf-8').read()
          refs=re.findall(r'(?:src|href)="([^"]+)"',html)
          local=[r for r in refs if not r.startswith(('http://','https://','#','data:'))]
          missing=[r for r in local if not os.path.exists(r)]
          if missing:
              raise SystemExit('Missing local assets: '+', '.join(missing))
          print('All local index.html assets exist:', ', '.join(local))
          PY
      - name: Check physics models
        run: |
          node tests/model-checks.js
          node tests/audit-model-sweep.js
          node tests/first-three-regression.cjs
          node tests/practicals-456-regression.cjs
          node tests/labbook-integrity.cjs
          node tests/test-worked-examples-complete.cjs
      - name: Install Chromium smoke-test dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: |
          python3 -m http.server 4173 >/tmp/aqa-practical-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          node tests/browser-smoke.js
          node tests/labbook-toggle-smoke.js
          node tests/learning-suite-smoke.js
